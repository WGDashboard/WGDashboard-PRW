repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.5.3
    hooks:
      - id: prettier
        files: ^src/web/.*\.(css|html|js|json|md|ts|vue|yaml|yml)$

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        pass_filenames: false
      - id: admin-eslint
        name: admin ESLint
        entry: npm --prefix src/web/admin run lint
        language: system
        pass_filenames: false
        files: ^src/web/admin/
      - id: admin-vitest
        name: admin Vitest
        entry: npm --prefix src/web/admin test
        language: system
        pass_filenames: false
        files: ^src/web/admin/
      - id: client-eslint
        name: client ESLint
        entry: npm --prefix src/web/client run lint
        language: system
        pass_filenames: false
        files: ^src/web/client/
      - id: client-vitest
        name: client Vitest
        entry: npm --prefix src/web/client test
        language: system
        pass_filenames: false
        files: ^src/web/client/
